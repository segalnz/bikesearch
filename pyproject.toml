[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motorcycle-monitor"
version = "0.3.2"
description = "Evidence-based NZ motorcycle discovery with a dashboard, SQLite history and optional AI review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "PyYAML>=6,<7", "paho-mqtt>=2,<3", "pypdf>=6,<7", "fonttools>=4.60,<5"]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/segalnz/bikesearch"
Issues = "https://github.com/segalnz/bikesearch/issues"

[project.scripts]
motorcycle-monitor = "motorcycle_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
motorcycle_monitor = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
