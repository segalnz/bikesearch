name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: python -m pytest -q
      - run: python scripts/check_publication.py --index
      - run: python scripts/demo.py --build-only /tmp/motorcycle-demo
      - run: node --check src/motorcycle_monitor/web_assets/dashboard.js
